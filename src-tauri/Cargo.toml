[package]
name = "ph-desktop"
version = "1.0.0"
description = "Native desktop client for cn.pornhub.com"
authors = ["local"]
edition = "2021"
rust-version = "1.77"
default-run = "ph-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process"] }
axum = "0.8"
scraper = "0.24"
url = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
httpdate = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"


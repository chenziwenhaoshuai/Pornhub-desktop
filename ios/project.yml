name: PornhubMobile
options:
  bundleIdPrefix: local.ph
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: "2.7.0"

targets:
  PornhubMobile:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PornhubMobile
        excludes:
          - "Info.plist"
    settings:
      base:
        INFOPLIST_FILE: PornhubMobile/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: local.ph.mobile
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: SwiftSoup
        product: SwiftSoup

schemes:
  PornhubMobile:
    build:
      targets:
        PornhubMobile: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

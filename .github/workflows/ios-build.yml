name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    # macos-15 镜像自带 Xcode 16/26，可编译 iOS 26 SDK
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          echo "== 已安装的 Xcode =="
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "选中: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          cd ios
          xcodebuild -resolvePackageDependencies \
            -project PornhubMobile.xcodeproj \
            -target PornhubMobile 2>&1 | tail -n 30

      - name: Build (unsigned, iphoneos)
        run: |
          set -o pipefail
          cd ios
          # 工程里没有 shared scheme，所以用 -target + SYMROOT 控制产物路径
          xcodebuild \
            -project PornhubMobile.xcodeproj \
            -target PornhubMobile \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/../build" \
            OBJROOT="$PWD/../build/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../build.log | tail -n 80

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/Release-iphoneos/PornhubMobile.app"
          if [ ! -d "$APP" ]; then
            echo "::error::构建产物不存在: $APP"
            ls -R build | head -60
            exit 1
          fi
          rm -rf Payload PornhubMobile-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry PornhubMobile-unsigned.ipa Payload
          ls -lh PornhubMobile-unsigned.ipa
          echo "--- Info ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist" || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PornhubMobile-unsigned-ipa
          path: PornhubMobile-unsigned.ipa
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
